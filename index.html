<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文计算机开源图书阅读平台</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #f8fafc;
      --sidebar-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-active: #ecfdf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部导航 */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 18px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 主布局 */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
      overflow: hidden;
    }

    /* 左侧书目与筛选区 */
    .sidebar {
      width: 360px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .filter-section {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
    }
    .category-select {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      outline: none;
      cursor: pointer;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .book-item {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .book-item:hover {
      border-color: #a7f3d0;
      background: #f8fafc;
    }
    .book-item.active {
      background: var(--card-active);
      border-color: var(--primary);
    }
    .book-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .book-item-tag {
      font-size: 11px;
      padding: 2px 8px;
      background: #f1f5f9;
      color: #475569;
      border-radius: 4px;
      font-weight: 500;
    }
    .book-item.active .book-item-tag {
      background: #10b981;
      color: #ffffff;
    }
    .book-item-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      color: #1e293b;
    }

    /* 右侧阅读与展示区 */
    .reader-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      position: relative;
    }
    .reader-toolbar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }
    .current-reading-title {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }
    .toolbar-actions {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      text-decoration: none;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: #f1f5f9;
      color: var(--primary-dark);
    }
    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .action-btn.primary:hover {
      background: var(--primary-dark);
    }

    .reader-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .reader-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* 优雅提示条 */
    .notice-bar {
      background: #fffbeb;
      color: #92400e;
      border-bottom: 1px solid #fef3c7;
      padding: 8px 16px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; height: 45%; }
      .reader-area { height: 55%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 中文开源计算机图书阅读平台</h1>
    <div class="header-info" id="statsInfo">正在整理中文书库...</div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="filter-section">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 快速搜索书名/作者/关键词..." oninput="filterBooks()">
        <select id="categorySelect" class="category-select" onchange="filterBooks()">
          <option value="all">全部分类 (全部)</option>
        </select>
      </div>
      <div class="book-list" id="bookList">
        <div style="text-align: center; padding: 20px; color: #94a3b8; font-size: 13px;">正在解析中文书目...</div>
      </div>
    </div>

    <div class="reader-area">
      <div class="reader-toolbar">
        <div class="current-reading-title" id="readingTitle">👈 请在左侧选择一本书籍开始阅读</div>
        <div class="toolbar-actions" id="readerActions" style="display: none;">
          <a id="externalLink" href="#" target="_blank" rel="noopener noreferrer" class="action-btn primary">在新窗口阅读全文 ↗</a>
        </div>
      </div>

      <div class="reader-content">
        <div id="noticeBar" class="notice-bar" style="display: none;">
          <span>💡 若右侧显示空白，说明该书源站开启了防内嵌保护，请点击右上角「在新窗口阅读全文」直接浏览。</span>
        </div>
        <div id="emptyView" class="empty-state">
          <div class="empty-state-icon">📖</div>
          <p>在左侧选择图书即可开始阅读</p>
        </div>
        <iframe id="bookFrame" class="reader-frame" style="display: none;"></iframe>
      </div>
    </div>
  </div>

  <script>
    let allBooks = [];
    let currentFiltered = [];
    let activeBook = null;

    // 清理文本中的 HTML 标签、多余符号及 Markdown 标记
    function cleanText(text) {
      if (!text) return '';
      return text
        .replace(/<[^>]+>/g, '')             // 剔除所有 HTML 标签如 <a id="...">
        .replace(/\*\(.*?\)\*/g, '')          // 剔除 *(...)* 标记
        .replace(/`([^`]+)`/g, '$1')          // 剔除反引号
        .replace(/\s+/g, ' ')                 // 压缩空格
        .trim();
    }

    function hasChinese(text) {
      return /[\u4e00-\u9fa5]/.test(text);
    }

    async function loadMarkdown() {
      const localPath = 'books/free-programming-books-zh.md';
      const fallbackPath = 'https://raw.githubusercontent.com/EbookFoundation/free-programming-books/main/books/free-programming-books-zh.md';
      try {
        const res = await fetch(localPath);
        if (res.ok) return await res.text();
      } catch (e) {}
      const fallbackRes = await fetch(fallbackPath);
      return await fallbackRes.text();
    }

    function parseMarkdown(mdText) {
      const lines = mdText.split('\n');
      let currentSection = '通用计算机与编程';
      const books = [];
      const categories = new Set();

      for (let line of lines) {
        line = line.trim();

        // 提取标题作为分类并清洗 HTML
        if (line.startsWith('### ')) {
          let raw = cleanText(line.replace('###', ''));
          if (raw && !raw.toLowerCase().includes('index')) currentSection = raw;
        } else if (line.startsWith('## ') && !line.includes('Index') && !line.includes('目录') && !line.includes('License')) {
          let raw = cleanText(line.replace('##', ''));
          if (raw) currentSection = raw;
        }

        // 提取图书链接：* [书名](网址) 附加信息
        const match = line.match(/^\*\s*\[(.*?)\]\((.*?)\)(.*)$/);
        if (match) {
          const rawTitle = cleanText(match[1]);
          const url = match[2].trim();
          const extra = cleanText(match[3] ? match[3].replace(/^[-\s:()]+/, '').replace(/[)]+$/, '') : '');

          if (url.startsWith('http') && (hasChinese(rawTitle) || hasChinese(extra) || hasChinese(currentSection))) {
            const displayTitle = extra ? `${rawTitle} · ${extra}` : rawTitle;
            books.push({
              title: displayTitle,
              url: url,
              category: currentSection
            });
            categories.add(currentSection);
          }
        }
      }
      return { books, categories: Array.from(categories) };
    }

    function populateCategories(cats) {
      const select = document.getElementById('categorySelect');
      select.innerHTML = '<option value="all">全部分类 (全部)</option>' +
        cats.sort((a, b) => a.localeCompare(b, 'zh-CN')).map(cat => {
          const count = allBooks.filter(b => b.category === cat).length;
          return `<option value="${cat}">${cat} (${count})</option>`;
        }).join('');
    }

    function renderBookList(list) {
      const listEl = document.getElementById('bookList');
      if (list.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; padding: 30px 10px; color: #94a3b8; font-size: 13px;">没有找到匹配的书籍</div>';
        return;
      }

      listEl.innerHTML = list.map((b, idx) => `
        <div class="book-item ${activeBook && activeBook.url === b.url ? 'active' : ''}" onclick="selectBook(${idx})">
          <div class="book-item-header">
            <span class="book-item-tag">${escapeHtml(b.category)}</span>
          </div>
          <div class="book-item-title">${escapeHtml(b.title)}</div>
        </div>
      `).join('');
    }

    function selectBook(idx) {
      const book = currentFiltered[idx];
      activeBook = book;
      renderBookList(currentFiltered);

      document.getElementById('readingTitle').innerText = `📖 ${book.title}`;
      document.getElementById('externalLink').href = book.url;
      document.getElementById('readerActions').style.display = 'flex';
      document.getElementById('noticeBar').style.display = 'flex';

      document.getElementById('emptyView').style.display = 'none';
      const frame = document.getElementById('bookFrame');
      frame.style.display = 'block';
      frame.src = book.url;
    }

    function filterBooks() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedCat = document.getElementById('categorySelect').value;

      currentFiltered = allBooks.filter(b => {
        const matchCat = (selectedCat === 'all') || (b.category === selectedCat);
        const matchQuery = !query || b.title.toLowerCase().includes(query) || b.category.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      renderBookList(currentFiltered);
      document.getElementById('statsInfo').innerText = `共检索到 ${currentFiltered.length} 本中文书籍`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function init() {
      try {
        const md = await loadMarkdown();
        const { books, categories } = parseMarkdown(md);
        allBooks = books;
        currentFiltered = books;
        populateCategories(categories);
        renderBookList(currentFiltered);
        document.getElementById('statsInfo').innerText = `已整理 ${allBooks.length} 本中文开源图书`;
        
        if (books.length > 0) {
          selectBook(0);
        }
      } catch (e) {
        document.getElementById('bookList').innerHTML = '<div style="text-align:center; padding: 20px; color:#ef4444;">加载失败，请刷新重试</div>';
      }
    }

    init();
  </script>
</body>
</html>
